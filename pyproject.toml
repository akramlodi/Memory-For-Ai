[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "elephantus"
version = "0.1.0"
description = "Elephantus: a small, local memory layer for AI apps."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
    "anthropic>=0.40",
    "openai>=1.106",  # callable api_key (Azure Entra ID tokens)
    "fastembed>=0.4",
    "mcp>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
azure = ["azure-identity>=1.17"]  # only needed for AZURE_USE_ENTRA_ID=true

[project.scripts]
elephantus = "elephantus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["elephantus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs a real LLM provider (skipped unless ELEPHANTUS_LIVE_TESTS=1)"]
