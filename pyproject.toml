[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mini-supermemory"
version = "0.1.0"
description = "A small, local, educational memory layer for AI apps, inspired by Supermemory."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
    "anthropic>=0.40",
    "openai>=1.40",
    "fastembed>=0.4",
    "mcp>=2.2,<3",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
mini-sm = "mini_supermemory.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["mini_supermemory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs a real LLM provider (skipped unless MINI_SM_LIVE_TESTS=1)"]
